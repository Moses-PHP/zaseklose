<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ZASEKLOse</title>
<meta name="description" content="Něco se chystá. Tentokrát se to nezasekne." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f4f1ea;
    --ink: #141210;
    --red: #ed1c24;
    --muted: rgba(20, 18, 16, .5);
    --hair: rgba(20, 18, 16, .18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Archivo, sans-serif;
    min-height: 100svh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: clamp(72px, 12vh, 120px) clamp(24px, 5vw, 64px);
  }

  /* corner meta */
  .meta {
    position: absolute;
    top: clamp(20px, 4vh, 36px);
    font-family: "Space Mono", monospace;
    font-size: clamp(10px, 1.4vw, 11px);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .meta--left { left: clamp(24px, 5vw, 44px); }
  .meta--right { right: clamp(24px, 5vw, 44px); }

  .center { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 920px; }

  .logo {
    width: clamp(190px, 32vw, 300px);
    height: auto;
    margin-bottom: clamp(28px, 5vh, 48px);
  }

  .eyebrow {
    font-family: "Space Mono", monospace;
    font-size: clamp(11px, 1.6vw, 13px);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--red);
    margin: 0 0 clamp(22px, 4vh, 34px);
    padding-left: 0.5em;
  }

  /* countdown */
  .cd {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: clamp(10px, 2.4vw, 24px);
  }
  .cd-unit { display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 1.4vh, 14px); }
  .cd-num {
    font-family: "Space Mono", monospace;
    font-weight: 500;
    font-size: clamp(38px, 8.5vw, 66px);
    line-height: 0.9;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .cd-label {
    font-family: "Space Mono", monospace;
    font-size: clamp(9px, 1.3vw, 11px);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 0.3em;
  }
  .cd-sep {
    font-family: "Space Mono", monospace;
    font-weight: 500;
    font-size: clamp(28px, 6vw, 50px);
    line-height: 0.9;
    color: var(--red);
    transform: translateY(-0.06em);
  }
  .cd-sep.blink { animation: blink 2s steps(1, end) infinite; }

  .divider { width: 1px; height: clamp(28px, 5vh, 44px); background: var(--hair); margin: clamp(28px, 5vh, 44px) 0 clamp(16px, 3vh, 24px); }

  .tagline {
    font-family: Newsreader, serif;
    font-style: italic;
    font-size: clamp(18px, 2.8vw, 24px);
    color: rgba(20, 18, 16, .78);
    text-align: center;
    text-wrap: balance;
    margin: 0;
  }

  @keyframes blink { 0%, 48% { opacity: 1; } 50%, 98% { opacity: .18; } 100% { opacity: 1; } }

  /* gentle entrance — safe in a standalone page (no remount) */
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.3,1) forwards; }
  .d1 { animation-delay: .05s; }
  .d2 { animation-delay: .18s; }
  .d3 { animation-delay: .30s; }
  .d4 { animation-delay: .46s; }

  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; animation: none; }
    .blink { animation: none; }
  }

  /* tiny phones: drop the est. label so the meta row stays clean */
  @media (max-width: 380px) {
    .meta--right { display: none; }
    .cd { gap: 7px; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="meta meta--left">ZASEKLOse</div>
    <div class="meta meta--right">est. 2026</div>

    <div class="center">
      <img class="logo rise d1" src="assets/logo.png" alt="ZASEKLOse" />

      <p class="eyebrow rise d2">Připravujeme</p>

      <div class="cd rise d3" role="timer" aria-label="Odpočet do 10. prosince 2026">
        <div class="cd-unit"><span class="cd-num" data-cd="d">--</span><span class="cd-label">dní</span></div>
        <span class="cd-sep blink" aria-hidden="true">:</span>
        <div class="cd-unit"><span class="cd-num" data-cd="h">--</span><span class="cd-label">hodin</span></div>
        <span class="cd-sep blink" aria-hidden="true">:</span>
        <div class="cd-unit"><span class="cd-num" data-cd="m">--</span><span class="cd-label">minut</span></div>
        <span class="cd-sep blink" aria-hidden="true">:</span>
        <div class="cd-unit"><span class="cd-num" data-cd="s">--</span><span class="cd-label">sekund</span></div>
      </div>

      <div class="divider rise d3"></div>

      <p class="tagline rise d4">„Tentokrát se to nezasekne.&#8221;</p>
    </div>
  </main>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#f4f1ea" />
      <rect x="22" y="22" width="56" height="56" rx="10" fill="none" stroke="#141210" stroke-width="6" />
      <text x="50" y="58" font-family="monospace" font-size="20" font-weight="700" text-anchor="middle" fill="#141210">Z<tspan fill="#ed1c24">se</tspan></text>
    </svg>
  </template>

  <script>
    // Reveal moment — change this single line to adjust date/time.
    var TARGET = new Date('2026-12-10T20:00:00');
    function tick() {
      var diff = Math.max(0, TARGET.getTime() - Date.now());
      var d = Math.floor(diff / 86400000); diff -= d * 86400000;
      var h = Math.floor(diff / 3600000); diff -= h * 3600000;
      var m = Math.floor(diff / 60000); diff -= m * 60000;
      var s = Math.floor(diff / 1000);
      var set = function (k, v) { var el = document.querySelector('[data-cd="' + k + '"]'); if (el) el.textContent = v; };
      set('d', String(d));
      set('h', String(h).padStart(2, '0'));
      set('m', String(m).padStart(2, '0'));
      set('s', String(s).padStart(2, '0'));
    }
    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
